<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Please wait...</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!--<link href="https://use.fontawesome.com/releases/v5.15.0/css/all.css" rel="stylesheet">-->
    <script src="/Application/resources.js"></script> <!--Comes from server see resource controller-->
    <!--Own Client only resources -->
    <link href="_content/MudBlazor/MudBlazor.min.css?v=5.0.5" rel="stylesheet" />
    <link href="css/site.min.css" rel="stylesheet" /> <!--Main Site Css-->
    <link href="CleanArchitectureBase.Client.styles.css" rel="stylesheet"> <!--Blazor Component Based CSS Isolation https://docs.microsoft.com/de-de/aspnet/core/blazor/components/css-isolation?view=aspnetcore-5.0-->
</head>

<body>
    <div id="overlay-app-load" class="app-load full-overlay">
        <div class="app-preload">
            <div class="mud-wasm"></div>
            <div class="mud-wasm" style="animation-direction:alternate-reverse;animation-duration:4s;"></div>
            <div class="mud-wasm" style="animation-duration:5s;"></div>
            <div class="mud-wasm-cont ">
                <svg id="app-logo" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" />
                <h1 id="sub-text" class="sub-text">Please wait...</h1>
            </div>
        </div>
    </div>

    <div id="app">

    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        document.querySelector('#app-logo').insertAdjacentHTML('beforeend', Application.CustomIcons.ApplicationMainIcon);
        document.querySelector('#sub-text').innerHTML = `${Application.ApplicationConstants.ApplicationName} ${Application.ApplicationConstants.Version}`;
        document.title = Application.ApplicationConstants.ApplicationName + ' - Home';
        var app = document.getElementById('app');
        app.addEventListener('DOMSubtreeModified', contentChanged, false);

        function contentChanged() {
            app.removeEventListener('DOMSubtreeModified', contentChanged);
            var overlay = document.getElementById('overlay-app-load');
            if (overlay)
                overlay.remove();
        }
    </script>

    <script async src="js/site.es5.min.js"></script>
    <script async src="_framework/blazor.webassembly.js"></script>
    <script async src="_content/MudBlazor/MudBlazor.min.js?v=5.0.5"></script>
</body>
</html>
